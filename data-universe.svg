<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#1b0a3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7b2cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .link { stroke:#00f0ff; stroke-width:1; stroke-opacity:0.15; animation: pulse 2.5s ease-in-out infinite; }
    .node { fill:#ff00e5; filter:url(#glow); animation: blink 2s ease-in-out infinite; }
    .title { font-family: monospace; font-weight: bold; fill:#00f0ff; letter-spacing: 3px; }
    .bin { font-family: monospace; font-size: 14px; fill:#00ff9d; }
    @keyframes pulse { 0%,100%{stroke-opacity:0.1} 50%{stroke-opacity:0.8} }
    @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }
  </style>

  <rect width="800" height="320" rx="24" fill="url(#bg)"/>
  <rect width="800" height="320" rx="24" fill="url(#grid)"/>

  <!-- title -->
  <text x="400" y="38" text-anchor="middle" font-size="18" class="title">DATA · ANALYTICS · ML · ENGINEERING</text>

  <!-- falling binary -->
  <text class="bin" x="380" y="60" opacity="0.5">1
    <animate attributeName="y" values="50;300" dur="4s" repeatCount="indefinite"/>
  </text>
  <text class="bin" x="400" y="60" opacity="0.5">0
    <animate attributeName="y" values="50;300" dur="3s" repeatCount="indefinite"/>
  </text>
  <text class="bin" x="420" y="60" opacity="0.5">1
    <animate attributeName="y" values="50;300" dur="5s" repeatCount="indefinite"/>
  </text>
  <text class="bin" x="780" y="60" opacity="0.4">0
    <animate attributeName="y" values="50;300" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text class="bin" x="20" y="60" opacity="0.4">1
    <animate attributeName="y" values="50;300" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- chart axis -->
  <line x1="40" y1="250" x2="365" y2="250" stroke="#00f0ff" stroke-opacity="0.6"/>
  <line x1="40" y1="70" x2="40" y2="250" stroke="#00f0ff" stroke-opacity="0.6"/>

  <!-- animated bars -->
  <rect x="50" y="170" width="28" height="80" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="80;140;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="170;110;190;170" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="90" y="130" width="28" height="120" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="120;70;150;120" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="130;180;100;130" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="130" y="190" width="28" height="60" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="60;130;90;60" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="190;120;160;190" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="170" y="100" width="28" height="150" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="150;100;140;150" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="100;150;110;100" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="210" y="160" width="28" height="90" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="90;50;120;90" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="160;200;130;160" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="120" width="28" height="130" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="130;160;80;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="120;90;170;120" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="290" y="180" width="28" height="70" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="70;110;150;70" dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="180;140;100;180" dur="3.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="330" y="140" width="28" height="110" rx="4" fill="url(#bar)">
    <animate attributeName="height" values="110;60;100;110" dur="2.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="140;190;150;140" dur="2.9s" repeatCount="indefinite"/>
  </rect>

  <!-- trend line drawing itself -->
  <path d="M64 200 L104 150 L144 170 L184 110 L224 130 L264 80 L304 100 L344 60"
        fill="none" stroke="#ff00e5" stroke-width="3" pathLength="1"
        stroke-dasharray="1" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.6;0.9;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- neural network links: layer 1 -> layer 2 -->
  <g>
    <line class="link" x1="470" y1="110" x2="580" y2="85"/>
    <line class="link" x1="470" y1="110" x2="580" y2="135"/>
    <line class="link" x1="470" y1="110" x2="580" y2="185"/>
    <line class="link" x1="470" y1="110" x2="580" y2="235"/>
    <line class="link" x1="470" y1="160" x2="580" y2="85"/>
    <line class="link" x1="470" y1="160" x2="580" y2="135"/>
    <line class="link" x1="470" y1="160" x2="580" y2="185"/>
    <line class="link" x1="470" y1="160" x2="580" y2="235"/>
    <line class="link" x1="470" y1="210" x2="580" y2="85"/>
    <line class="link" x1="470" y1="210" x2="580" y2="135"/>
    <line class="link" x1="470" y1="210" x2="580" y2="185"/>
    <line class="link" x1="470" y1="210" x2="580" y2="235"/>
  </g>
  <!-- layer 2 -> layer 3 -->
  <g style="animation-delay:1s">
    <line class="link" x1="580" y1="85" x2="690" y2="110" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="85" x2="690" y2="160" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="85" x2="690" y2="210" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="135" x2="690" y2="110" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="135" x2="690" y2="160" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="135" x2="690" y2="210" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="185" x2="690" y2="110" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="185" x2="690" y2="160" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="185" x2="690" y2="210" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="235" x2="690" y2="110" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="235" x2="690" y2="160" style="animation-delay:1s"/>
    <line class="link" x1="580" y1="235" x2="690" y2="210" style="animation-delay:1s"/>
  </g>

  <!-- neural network nodes -->
  <circle class="node" cx="470" cy="110" r="9"/>
  <circle class="node" cx="470" cy="160" r="9" style="animation-delay:.3s"/>
  <circle class="node" cx="470" cy="210" r="9" style="animation-delay:.6s"/>
  <circle class="node" cx="580" cy="85" r="9" style="animation-delay:.9s"/>
  <circle class="node" cx="580" cy="135" r="9" style="animation-delay:1.2s"/>
  <circle class="node" cx="580" cy="185" r="9" style="animation-delay:1.5s"/>
  <circle class="node" cx="580" cy="235" r="9" style="animation-delay:1.8s"/>
  <circle class="node" cx="690" cy="110" r="9" style="fill:#00ff9d;animation-delay:.2s"/>
  <circle class="node" cx="690" cy="160" r="9" style="fill:#00ff9d;animation-delay:.7s"/>
  <circle class="node" cx="690" cy="210" r="9" style="fill:#00ff9d;animation-delay:1.1s"/>

  <!-- labels -->
  <text x="200" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#9fb4ff">Analytics</text>
  <text x="580" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#9fb4ff">Machine Learning</text>
</svg>
